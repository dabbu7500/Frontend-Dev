<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <main class="gallery-wrap">
    <h1>Image Filter Gallery</h1>
    <section class="grid">
      <figure>
        <img src="https://picsum.photos/id/1015/800/600" alt="img1">
        <figcaption>Blur</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1025/800/600" alt="img2">
        <figcaption>Grayscale</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1011/800/600" alt="img3">
        <figcaption>Sepia</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1005/800/600" alt="img4">
        <figcaption>Brightness</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1001/800/600" alt="img5">
        <figcaption>Contrast</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1003/800/600" alt="img6">
        <figcaption>Hue Rotate</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
