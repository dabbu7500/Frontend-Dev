<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Responsive CSS Cheat Sheet</title>
  <link rel="stylesheet" href="cheatsheet.css">
</head>
<body>
  <main class="sheet">
    <h1>Responsive CSS Cheat Sheet</h1>
    <section class="grid">
      <div class="card"><h2>Filters</h2><p>filter: blur(), grayscale(), sepia()</p></div>
      <div class="card"><h2>Media Queries</h2><p>@media (max-width: 900px) { ... }</p></div>
      <div class="card"><h2>Responsive Design</h2><p>grid, flex, minmax, auto-fit</p></div>
      <div class="card"><h2>Typography</h2><p>font-size: clamp()</p></div>
      <div class="card"><h2>Units</h2><p>rem, em, vw, %</p></div>
      <div class="card"><h2>Breakpoints</h2><p>mobile, tablet, desktop</p></div>
    </section>
  </main>
</body>
</html>
