<article class="article">
  <h1>Designing for Readability</h1>
  <p><strong>Good typography</strong> improves user experience. <em>Whitespace</em> and spacing matter.</p>
  <p>Fonts: serif for long reads, sans-serif for UI. <mark>Important</mark> words stand out.</p>
  <p>Line length, line-height, and letter-spacing affect comfort.</p>
  <p>Use hierarchy with sizes and weights to guide readers.</p>
