<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="selectors.css">
</head>
<body>

<header>
    <h1>CSS Selectors Practice</h1>
</header>

<main>

<p class="para">This is a class selector.</p>
<p id="unique">This is an ID selector.</p>

<a href="#" data-type="external">Attribute selector link</a>

<div class="parent">
    <p>Descendant selector</p>
</div>

<div class="box">
    <p>First paragraph</p>
    <p>Second paragraph</p>
</div>

<ul>
    <li>Item A</li>
    <li>Item B</li>
</ul>

</main>

<footer>
    <p>Footer content</p>
</footer>

</body>
</html>
