<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pseudo Classes Demo</title>
    <link rel="stylesheet" href="Pseudo-Classes.css">
</head>
<body>

<h1>Pseudo-Class Demonstration</h1>

<div class="container">

    <div class="box">
        <h3>:hover</h3>
        <a href="#" class="demo-link">Hover this link</a>
    </div>

    <div class="box">
        <h3>:focus</h3>
        <input type="text" placeholder="Click to focus">
    </div>

    <div class="box">
        <h3>:active</h3>
        <button class="demo-btn">Click me</button>
    </div>

    <div class="box">
        <h3>:nth-child()</h3>
        <ul class="nth-demo">
            <li>List Item 1</li>
            <li>List Item 2</li>
            <li>List Item 3</li>
            <li>List Item 4</li>
        </ul>
    </div>

</div>

</body>
</html>
