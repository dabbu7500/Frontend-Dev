<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="complete.css">
</head>
<body>
<header class="site-header">
  <div class="nav">
    <div class="logo">Brand</div>
    <div class="links">
      <a href="#">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Welcome to Our Service</h1>
    <p>Building beautiful experiences</p>
  </div>
</section>

<section id="about" class="about">
  <div class="about-text">
    <h2>About Us</h2>
    <p>We create solutions that matter.</p>
  </div>
  <div class="about-image">
    <img src="https://via.placeholder.com/500x350" alt="">
  </div>
</section>

<section id="services" class="services">
  <div class="service">Design</div>
  <div class="service">Development</div>
  <div class="service">Consulting</div>
</section>

<section id="contact" class="contact-section">
  <form class="simple-form">
    <input type="text" placeholder="Name" required>
    <input type="email" placeholder="Email" required>
    <textarea placeholder="Message" rows="4" required></textarea>
    <button type="submit">Send</button>
  </form>
</section>

<footer class="site-footer">© 2025 Brand. All rights reserved.</footer>
</body>
</html>
